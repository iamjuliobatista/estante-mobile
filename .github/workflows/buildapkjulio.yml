name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma e build-tools do Android
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Usar chave de debug fixa (mantém a assinatura entre builds)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Build web (validação de www/)
        run: npm run build

      - name: Gerar projeto Android (se a pasta android/ não existir no repositório)
        run: |
          if [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK de debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verificar se o APK foi gerado
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -s "$APK" ]; then echo "ERRO: APK não encontrado em $APK"; exit 1; fi
          ls -l "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: minha-estante-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
